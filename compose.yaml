services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathofflipper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-pathofflipper}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional: npm run scheduler in a container. Starts only with `docker compose --profile scheduler up -d`, so
  # npm run db:up still starts PostgreSQL alone. Uses the checkout and its node_modules (npm ci first).
  scheduler:
    profiles: [scheduler]
    image: node:24-alpine
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["node", "src/cli/scheduler.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pathofflipper}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pathofflipper}
    volumes:
      - ./:/app:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
